name: test-and-build

on:
  push:
    branches: [main, main-integration-20261102, "softwarex-readiness-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests examples verify_pymapgis.py
      - name: Run full test suite with bundled fixtures
        run: python -m pytest -q
      - name: Run the public geological workflow
        run: python examples/geological_workflow.py
      - name: Run the bundled original-library rendering example
        run: python examples/render_bundled_jwd.py --output-dir "${{ runner.temp }}/jwd-render" --dpi 160

  build:
    name: Build and inspect release archives
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -e ".[dev]"
      - name: Build wheel and source archive
        run: python -m build
      - name: Inspect archive contents
        run: python tests/inspect_dist.py dist
      - name: Check long descriptions
        shell: bash
        run: python -m twine check dist/*
      - name: Retain archives for review
        uses: actions/upload-artifact@v4
        with:
          name: mapgis2shp-dist
          path: dist/*
          if-no-files-found: error
